name: Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}
    
    - name: Run all test suites
      run: |
        python3 -m pip install -e .
        python3 -m unittest -v engine.test_hardening engine.test_full_pipeline engine.test_engine
        python3 engine/test_c1_hard.py
        python3 engine/test_c2_runner.py
        python3 engine/test_c3_refiner.py
        python3 engine/test_c4_create.py
        python3 engine/test_constitution.py
        python3 -c "import sys; sys.path.insert(0, 'engine'); import test_runner"
        python3 -m compileall -q engine
